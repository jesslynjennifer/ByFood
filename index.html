<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByFood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ByFood — aplikasi pemesanan makanan kantin BINUS
   UI mengikuti desain Figma asli; perubahan hanya dari
   Feedback Grid usability testing (ditandai "FEEDBACK").
   ========================================================= */
/* Palet v3 — turunan dari #0880DE */
:root{
  --blue:#0880DE;      /* primary: header, tombol utama */
  --blue-d:#0668B8;    /* primary gelap: tombol chat/kirim, link */
  --blue-cat:#0880DE;
  --navy:#0B2545;      /* judul & teks utama */
  --ink:#5B6B7C;       /* ikon navigasi tidak aktif */
  --muted:#5B6B7C;     /* teks pendukung */
  --bg:#F5F9FD;        /* latar halaman */
  --line:#DCE6EF;      /* garis & border */
  --soft:#E3F1FC;      /* biru muda: chip, voucher, opsi terpilih */
  --field:#EEF3F8;     /* kotak isian */
  --orange:#F7931E;    /* aksen: status aktif, promo */
  --green-bg:#D1FADF; --green:#067647;
  --dark-btn:#0668B8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:#2F2F2F;color:var(--navy);display:flex;justify-content:center;align-items:center;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;color:var(--navy)}
img{display:block}
.phone{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@media (max-width:500px){
  body{background:var(--bg);align-items:stretch}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}

/* ---------- kerangka layar ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#0880DE 0,#3D9BE6 120px,#A9D3F5 200px,#F5F9FD 270px,#F5F9FD 100%)}
.screen.plain{background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hdr{padding:30px 28px 16px;color:#fff;display:flex;align-items:center;gap:10px;min-height:84px}
.hdr h1{font-size:20px;font-weight:700;flex:1;display:flex;align-items:center;gap:4px;line-height:1.2}
.hdr .back{display:flex;align-items:center;color:#fff;margin-left:-6px;padding:4px}
.hicons{display:flex;gap:14px}
.ibtn{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;color:#fff}
.badge{position:absolute;top:-2px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.badge.bump{animation:bump .4s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
/* v6: tombol jumlah (− n +) menggantikan tombol Order/+ setelah ditekan */
.stp{display:inline-flex;align-items:center;height:31px;border-radius:9px;background:var(--soft);overflow:hidden;animation:pop .18s ease-out}
.stp button{width:30px;height:31px;color:var(--blue);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stp button.plus{background:var(--blue);color:#fff}
.stp-n{width:32px;height:31px;border:0;background:transparent;text-align:center;font-family:inherit;font-weight:700;font-size:14px;color:var(--navy);outline:0;-moz-appearance:textfield;appearance:textfield}
.stp-n::-webkit-outer-spin-button,.stp-n::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.food-card .stp{height:28px;flex-shrink:0}.food-card .stp button{width:24px;height:28px;font-size:16px}.food-card .stp-n{width:22px;height:28px;font-size:13px}
.search{margin:2px 28px 16px;height:40px;background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(11,37,69,.10);display:flex;align-items:center;gap:8px;padding:0 14px}
.search input{border:0;outline:0;flex:1;font-size:12px;background:transparent}
.search input::placeholder{color:#B3B9BF}

/* ---------- navigasi bawah ---------- */
.bnav{position:relative;flex-shrink:0;height:92px;background:#fff;box-shadow:0 -6px 20px rgba(11,37,69,.06);border-radius:22px 22px 0 0;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding-bottom:6px}
.nv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink)}
.nv.on{color:var(--blue)}
.fab{justify-self:center;margin-top:-62px;width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(8,128,222,.35);display:flex;align-items:center;justify-content:center}
.fab.ring{background:#fff;color:var(--blue);border:2.5px solid var(--blue)}

/* ---------- beranda ---------- */
.welcome{padding:30px 28px 12px;display:flex;align-items:flex-start;color:#fff}
.welcome h1{font-size:20px;font-weight:700;line-height:1.3}
.welcome p{font-size:11px;font-weight:600}
.welcome > div:first-child{flex:1}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 26px}
.cat{aspect-ratio:1;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--navy);font-size:9.5px;font-weight:600;box-shadow:0 4px 12px rgba(11,37,69,.08)}
.cat svg{width:40px;height:40px;padding:8px;border-radius:12px;background:var(--soft);color:var(--blue)}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:22px 26px 10px;font-weight:600;font-size:15px}
.sec-h button{font-weight:700;font-size:14px;letter-spacing:-1px}
.hs{display:flex;gap:16px;overflow-x:auto;padding:0 26px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.food-card{flex:0 0 166px;background:#fff;border-radius:10px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(30,68,98,.10)}
.food-card .ph{position:relative;display:block;width:100%}
.food-card .ph img{width:166px;height:108px;object-fit:cover}
.food-card .rank{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.94);color:#9A4A00;font-size:9.5px;font-weight:700;display:flex;align-items:center;gap:3px}
.food-card .bd{padding:8px 10px 10px 12px;display:flex;flex-direction:column;gap:1px;flex:1}
.food-card .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-card .tn{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-card .tn svg{flex-shrink:0;width:12px;height:12px}
.food-card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.food-card .pr{font-size:13px;font-weight:700;color:var(--blue);white-space:nowrap}
.food-card .add{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
/* v3: daftar tenant disusun ke bawah */
.tlist{display:flex;flex-direction:column;gap:10px;padding:0 26px 24px}
.trow{display:flex;align-items:center;gap:12px;padding:10px;background:#fff;border-radius:14px;text-align:left;width:100%;box-shadow:0 3px 10px rgba(11,37,69,.06)}
.trow img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0}
.trow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trow b{font-size:14px;font-weight:700}
.trow .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .meta{display:flex;gap:6px;margin-top:3px}
.trow .pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--blue-d)}
.trow .pill.o{background:#FEF0DC;color:#9A4A00}
.trow .go{color:var(--muted);flex-shrink:0}

/* FEEDBACK: kartu pesanan aktif + tombol lacak di tengah beranda */
.active-card{margin:0 26px 18px;background:#fff;border-radius:16px;border-left:0;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px rgba(30,68,98,.12);text-align:left;width:calc(100% - 52px)}
.active-card img{width:54px;height:54px;border-radius:8px;object-fit:cover}
.active-card .tx{flex:1;min-width:0}
.active-card .st,.active-card .nm,.active-card .eta{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.active-card .st{font-size:11px;font-weight:600;color:#9A4A00}
.active-card .nm{font-size:14px;font-weight:700}
.active-card .eta{font-size:11px;color:var(--muted)}
.btn{background:var(--blue);color:#fff;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-sm{height:30px;padding:0 12px;font-size:12px}

/* ---------- daftar menu ---------- */
.chips{display:flex;gap:7px;padding:0 28px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:28px;padding:0 14px;border-radius:14px;font-size:11px;font-weight:500;background:#fff;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.list{border-top:1px solid var(--line)}
/* FEEDBACK: nama tenant tampil sebelum daftar menunya */
.tenant-h{display:flex;align-items:center;gap:10px;padding:10px 33px;background:var(--soft);border-bottom:1px solid var(--line)}
.tenant-h b{font-size:14px;font-weight:700}
.tenant-h span{display:block;font-size:11px;color:var(--muted)}
.row{display:flex;gap:12px;padding:12px 33px;border-bottom:1px solid var(--line);background:#fff}
.row img{width:96px;height:96px;border-radius:10px;object-fit:cover}
.row .info{flex:1;display:flex;flex-direction:column;padding-top:8px}
.row .nm{font-size:14.5px;font-weight:600}
.row .tn{font-size:13px;color:var(--muted);margin-top:1px}
.row .pl{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.row .pr{font-size:14.5px;font-weight:600}
.btn-order{height:31px;width:74px;font-size:15px}
.empty{padding:60px 40px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}

/* ---------- keranjang ---------- */
.seg{display:flex;justify-content:center;gap:16px;padding:0 0 10px}
.seg button{width:126px;height:30px;border-radius:15px;font-size:12px;font-weight:600;border:1.5px solid var(--blue);background:#fff;color:var(--blue)}
.seg button.on{background:var(--blue);color:#fff}
.pad{padding:0 30px}
.loc-row{display:flex;align-items:center;gap:8px;padding:8px 0;width:100%;text-align:left;font-size:12px;font-weight:600}
.loc-row .s{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.lbl{font-size:12px;font-weight:700;margin:8px 0 6px}
.opt{width:100%;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:500;background:#fff;border:1px solid var(--line);margin-bottom:6px;border-radius:8px;text-align:left}
.opt.on{background:var(--soft);border-color:var(--blue);color:var(--blue-d);font-weight:600}
.opt .r{font-weight:700;font-size:12px}
.note{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-size:12px;outline:0;resize:none}
.note::placeholder{color:#A9B3BC}
.citem{margin:16px 20px 18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px}
.citem + .citem{margin-top:-8px}
.citem img{width:56px;height:56px;border-radius:4px;object-fit:cover}
.citem .tx{flex:1;display:flex;flex-direction:column}
.citem .top{display:flex;justify-content:space-between;gap:6px}
.citem .nm{font-size:12.5px;font-weight:700}
.citem .tn{font-size:11px;color:var(--muted)}
.citem .pr{font-size:12.5px;font-weight:700;white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px;align-self:flex-end;margin-top:auto;font-size:13px}
.qty button{width:24px;height:24px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;border-radius:4px}
.qty button:hover{background:var(--field)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:0 30px;height:38px;font-size:12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff}
.sum-row.v{background:var(--soft);color:var(--blue-d);font-weight:600}
.nv-ic{position:relative;display:flex}
.nv .badge{top:-6px;right:-10px}
.ibtn.me img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 6px rgba(11,37,69,.2)}
.pay-bar{flex-shrink:0;background:#fff;padding:14px 30px 40px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:4px}
.pm.set{color:var(--navy);font-weight:600}
.total{font-size:20px;font-weight:700}
.btn-pesan{height:36px;width:120px;font-size:14px}

/* ---------- sheet & modal ---------- */
.dim{position:absolute;inset:0;background:rgba(17,24,31,.42);z-index:20;display:flex;align-items:flex-end;animation:fade .18s}
.dim.center{align-items:center;justify-content:center}
.sheet{width:100%;max-height:78%;background:#fff;border-radius:14px 14px 0 0;padding:10px 22px 30px;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet .handle{width:56px;height:4px;border-radius:2px;background:#D5DADF;margin:0 auto 18px}
.sheet h2{font-size:14px;font-weight:700;margin-bottom:12px}
.sheet .opts{overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.sopt{height:44px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:13px;font-weight:600;text-align:left}
.sopt.on{border-color:var(--blue);background:#EEF6FD}
.dot{width:20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.modal{position:relative;width:250px;background:#fff;border-radius:10px;padding:30px 22px 22px;text-align:center;animation:pop .2s ease-out}
.modal h2{font-size:20px;font-weight:700;margin:12px 0 4px}
.modal p{font-size:11px;color:var(--muted);margin-bottom:16px}
.modal .x{position:absolute;top:10px;right:12px;color:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#1E2A35;color:#fff;font-size:12px;padding:10px 16px;border-radius:20px;z-index:30;white-space:nowrap;animation:fade .2s}

/* ---------- pembayaran ---------- */
.paybox{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 40px 0;text-align:center}
.paybox h2{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:26px}
.paybox .amt{font-size:17px;font-weight:700;margin:22px 0 26px}
.link{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.btn-wide{height:44px;width:100%;max-width:260px;font-size:14px;margin-top:22px;border-radius:6px}
.wallet{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;margin-bottom:18px}

/* ---------- pesanan ---------- */
.ord{display:flex;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:#fff;position:relative;text-align:left;width:100%}
.ord img{width:52px;height:52px;border-radius:6px;object-fit:cover}
.ord .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ord .nm{font-size:12px;font-weight:700}
.ord .sub{font-size:10px;color:var(--muted)}
.ord .pr{font-size:12px;font-weight:700;margin-top:6px}
.ord .act{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.tag{font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px}
.tag.on{background:var(--green-bg);color:var(--green)}
.tag.done{background:#EEF3F8;color:var(--muted)}
.tag.sch{background:var(--soft);color:var(--blue-d)}
.btn-ord{height:24px;width:92px;font-size:10px}

/* ---------- tracking ---------- */
.card{margin:0 22px 14px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(11,37,69,.06)}
.who{display:flex;align-items:center;gap:12px}
.who img{width:46px;height:46px;border-radius:6px;object-fit:cover}
.who .tx{flex:1}
.who b{font-size:14px;font-weight:700;display:block}
.who span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px}
.sq{width:34px;height:34px;border-radius:7px;background:var(--dark-btn);color:#fff;display:flex;align-items:center;justify-content:center}
/* FEEDBACK: estimasi waktu + tracking ala Gojek/Grab */
.eta-card{margin:0 22px 14px;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 4px 14px rgba(30,68,98,.1)}
.eta-top{display:flex;justify-content:space-between;align-items:flex-end}
.eta-top small{font-size:11px;color:var(--muted);display:block}
.eta-top strong{font-size:26px;font-weight:700;line-height:1.1}
.eta-chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;background:#FFF0DD;color:#B35C00}
.route{position:relative;height:30px;margin:16px 6px 4px}
.route .ln{position:absolute;left:12px;right:12px;top:14px;height:3px;background:#DCE3E9;border-radius:2px}
.route .fill{position:absolute;left:12px;top:14px;height:3px;background:var(--orange);border-radius:2px;transition:width .6s}
.route .pt{position:absolute;top:2px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.route .mv{position:absolute;top:-1px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:var(--orange);color:#fff;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:left .6s}
.route-l{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:600}
.alert{margin-top:12px;font-size:11px;font-weight:600;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.alert.warn{background:#FFF0DD;color:#8A4500}
.alert.ok{background:var(--green-bg);color:#1C6A3A}
.tl{list-style:none;margin:18px 0 6px 10px}
.tl li{display:flex;gap:14px;position:relative;padding-bottom:30px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:#DCE6EF}
.tl li.done::before{background:var(--orange)}
.tl li:last-child::before{display:none}
.tl .c{width:32px;height:32px;border-radius:50%;background:#DCE6EF;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.tl li.done .c,.tl li.cur .c{background:var(--orange)}
.tl li.cur .c{box-shadow:0 0 0 5px #FDE3C3}
.tl .t{font-size:11px;font-weight:600;color:#8A99A8;padding-top:3px}
.tl li.done .t,.tl li.cur .t{color:var(--navy)}
.tl li.done .t small,.tl li.cur .t small{color:#9A4A00}
.tl .t small{display:block;font-size:9.5px;font-weight:500}

/* ---------- notifikasi ---------- */
.ntf{display:flex;gap:16px;padding:20px 26px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left}
.ntf.new{background:var(--soft)}
.ntf img{width:76px;height:76px;border-radius:10px;object-fit:cover}
.ntf b{font-size:13px;font-weight:700;display:block;margin-bottom:2px}
.ntf p{font-size:10px;line-height:1.5}

/* ---------- chat ---------- */
.chat-hdr{padding:30px 22px 14px;display:flex;align-items:center;gap:10px;color:#fff}
.chat-hdr img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.chat-hdr h1{flex:1;font-size:15px;font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:4px 18px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msgs .day{align-self:center;font-size:9px;color:var(--muted)}
.bub{max-width:240px;font-size:11.5px;padding:8px 12px;border:1px solid var(--line);border-radius:14px 14px 14px 4px;background:#fff;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--blue);border-color:var(--blue);color:#fff;border-radius:14px 14px 4px 14px}
.bub.me small{color:#D6EAFB}
.bub.them{align-self:flex-start}
.bub small{display:block;font-size:8.5px;color:var(--muted);text-align:right;margin-top:2px}
.composer{flex-shrink:0;background:#fff;padding:16px 16px 28px;display:flex;align-items:center;gap:12px}
.composer input{flex:1;height:38px;border:0;outline:0;background:var(--field);border-radius:19px;padding:0 14px;font-size:12px}
.send{width:30px;height:30px;border-radius:50%;background:var(--dark-btn);color:#fff;display:flex;align-items:center;justify-content:center}

/* ---------- profil ---------- */
.pcard{margin:20px 34px 0;background:#fff;border-radius:18px;box-shadow:0 6px 20px rgba(11,37,69,.08);padding:36px 28px 40px}
.avatar{position:relative;width:105px;height:105px;margin:0 auto 30px}
.avatar img{width:105px;height:105px;border-radius:50%;object-fit:cover}
.avatar .ed{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--dark-btn);border:2px solid var(--dark-btn);display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px}
.stat{background:var(--soft);border-radius:10px;text-align:center;padding:10px 4px 8px}
.stat b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.stat span{font-size:11px;color:#3B556B;line-height:1.4;display:block}
.fl{font-size:15px;font-weight:600;margin:0 0 6px}
.fv{width:100%;height:36px;background:var(--field);border:0;border-radius:8px;padding:0 14px;font-size:12px;display:flex;align-items:center;margin-bottom:22px;outline:0}
.points{display:block;width:max-content;margin:-18px auto 22px;font-size:11px;font-weight:700;color:#B35C00;background:#FFF0DD;border-radius:12px;padding:3px 10px}
.center-btn{display:flex;justify-content:center;margin-top:30px}
.btn-edit{height:28px;width:112px;font-size:12px;font-weight:700}

/* ---------- splash ---------- */
.splash{position:absolute;inset:0;z-index:40;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 75% at 50% 38%,#FFFFFF 0,#EEF6FD 50%,#D3E8FA 100%);transition:opacity .45s ease, transform .45s ease}
.splash.hide{opacity:0;transform:scale(1.04)}
.splash .blob{position:absolute;border-radius:50%}
.splash .b1{width:280px;height:280px;background:#0880DE;opacity:.09;top:-90px;right:-100px;animation:drift 7s ease-in-out infinite}
.splash .b2{width:220px;height:220px;background:#F7931E;opacity:.10;bottom:-70px;left:-80px;animation:drift 8s ease-in-out infinite reverse}
.splash .b3{width:90px;height:90px;background:#0B2545;opacity:.05;top:120px;left:-30px;animation:drift 6s ease-in-out infinite}
.splash .ring{position:absolute;top:50%;left:50%;width:250px;height:250px;margin:-170px 0 0 -125px;border-radius:50%;border:2px solid rgba(8,128,222,.14);animation:pulse 2.4s .6s ease-out infinite}
.splash .ring.r2{animation-delay:1.4s}
.sp-icon{position:relative;width:150px;animation:zoomIn .8s cubic-bezier(.18,1.3,.4,1) both;filter:drop-shadow(0 12px 22px rgba(8,128,222,.25))}
.sp-word{position:relative;width:196px;margin-top:22px;animation:rise .6s .5s ease-out both}
.sp-tag{position:relative;margin-top:12px;font-size:13px;font-weight:500;color:#5B6B7C;animation:rise .6s .75s ease-out both}
.sp-tag b{color:#0880DE;font-weight:600}
.sp-load{position:absolute;bottom:96px;width:132px;height:5px;border-radius:3px;background:#DCE6EF;overflow:hidden;animation:rise .4s .9s both}
.sp-load i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#0880DE,#4DB0F5);animation:load 1.9s 1s ease-in-out forwards}
.sp-foot{position:absolute;bottom:48px;font-size:11px;color:#8A99A8;letter-spacing:.3px;animation:rise .6s 1s both}
@keyframes zoomIn{0%{opacity:0;transform:translateX(-70px) scale(.55);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes load{to{width:100%}}
@keyframes pulse{0%{transform:scale(.7);opacity:0}30%{opacity:1}100%{transform:scale(1.35);opacity:0}}
@keyframes drift{50%{transform:translate(14px,18px)}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}.sp-load i{width:100%}}
</style>

}

const $app = document.getElementById('app');
const rp = n => 'Rp. ' + n.toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item = id => MENU.find(m => m.id === id);
const order = id => S.orders.find(o => o.id === id);
const clock = ms => { const d=new Date(ms); return String(d.getHours()).padStart(2,'0')+'.'+String(d.getMinutes()).padStart(2,'0'); };
const cur = () => S.stack[S.stack.length-1];
const cartCount = () => S.cart.reduce((a,c)=>a+c.qty,0);
const subtotal = () => S.cart.reduce((a,c)=>a+item(c.id).price*c.qty,0);
const totalCart = () => subtotal() + (S.mode==='delivery'?ONGKIR:0) + ADMIN;
const unread = () => S.notifs.filter(n=>!n.read).length;
const ongoing = () => S.orders.filter(o=>!o.done);

function stepsOf(o){ return o.mode==='delivery' ? ['diterima','disiapkan','siap','diantar','selesai'] : ['diterima','disiapkan','siap','selesai']; }
function actual(o,s){ return (EST[s]||0) + (o.delayed && s==='disiapkan' ? 5 : 0); }
function prog(o){
  const st = stepsOf(o), last = st.length-1;
  const estTotal = st.slice(0,last).reduce((a,s)=>a+EST[s],0);
  const actTotal = st.slice(0,last).reduce((a,s)=>a+actual(o,s),0);
  if(o.done) return {st, idx:last, times:o.times||[], rem:0, revealed:!!o.delayed, estTotal, actTotal, frac:1};
  if(o.slot) return {st, idx:0, times:[0], rem:null, scheduled:true, estTotal, actTotal, frac:0};
  const el = (Date.now()-o.created)/1000/SEC_PER_MIN;
  let cum=0, idx=0; const times=[0];
  for(let i=0;i<last;i++){ const a=actual(o,st[i]); if(el>=cum+a){ cum+=a; idx=i+1; times.push(cum); } else break; }
  const inStep = el-cum;
  // FEEDBACK: estimasi ikut di-update kalau tenant butuh waktu lebih lama
  const revealed = !!o.delayed && (idx>1 || (idx===1 && inStep>EST.disiapkan*0.6));
  const total = revealed ? actTotal : estTotal;
  const rem = Math.max(1, Math.ceil(total-el));
  const frac = idx>=last ? 1 : Math.min(1, el/total);
  return {st, idx, times, rem, revealed, estTotal, actTotal, frac};
}
function etaClock(o,p){ return clock(o.created + (p.revealed?p.actTotal:p.estTotal)*60000); }
function stepClock(o,min){ return clock(o.created + min*60000); }

function go(name, params={}){ S.stack.push({name, ...params}); S.sheet=null; render(); scrollTop(); }
function back(){ if(S.stack.length>1) S.stack.pop(); else S.stack=[{name:'home'}]; S.sheet=null; render(); }
function tab(name){ S.stack=[{name}]; S.sheet=null; render(); scrollTop(); }
function scrollTop(){ const s=$app.querySelector('.scroll'); if(s) s.scrollTop=0; }
function toast(msg){ S.toast=msg; render(true); clearTimeout(toast.t); toast.t=setTimeout(()=>{ S.toast=null; render(true); }, 2000); }
function notify(o, title, body){ S.notifs.unshift({id:'n'+Date.now()+Math.random(), order:o.id, title, body, read:false}); }

/* jumlah item di keranjang + tombol − n + */
function qtyOf(id){ const c=S.cart.find(c=>c.id===id); return c?c.qty:0; }
function stepper(m){
  return `<div class="stp"><button data-a="dec" data-v="${m.id}" aria-label="Kurangi ${esc(m.name)}">−</button><input class="stp-n" type="number" inputmode="numeric" min="0" data-id="${m.id}" value="${qtyOf(m.id)}" aria-label="Jumlah ${esc(m.name)}"><button class="plus" data-a="inc" data-v="${m.id}" aria-label="Tambah ${esc(m.name)}">+</button></div>`;
}
function setQty(id,n){
  n = Math.max(0, Math.min(99, n|0));
  const c=S.cart.find(c=>c.id===id);
  if(n===0){ S.cart=S.cart.filter(x=>x.id!==id); }
  else if(c){ c.qty=n; } else { S.cart.push({id,qty:n}); }
  S.bump=true; render(true); setTimeout(()=>{ S.bump=false; },420);
}
/* daftar menu dikelompokkan per tenant */
function listHTML(r){
  const q = S.query.trim().toLowerCase();
  const cat = CAT_OF[r.title];
  const items = MENU.filter(m =>
    (r.tenant ? m.t===r.tenant : r.all ? true : m.cat===cat) &&
    (cat!=='berat' || S.filter==='all' || m.tags.includes(S.filter)) &&
    (!q || m.name.toLowerCase().includes(q) || TENANTS[m.t].name.toLowerCase().includes(q)));
  if(!items.length && cat && cat!=='berat' && !q) return `<div class="empty"><b>Menu ${esc(r.title)} belum tersedia</b>Tenant belum menambahkan menu di kategori ini.</div>`;
  if(!items.length) return `<div class="list"><div class="empty"><b>Menu tidak ditemukan</b>Coba kata kunci atau kategori lain.</div></div>`;
  const groups = {};
  items.forEach(m => (groups[m.t] ||= []).push(m));
  return `<div class="list">${Object.entries(groups).map(([t,ms]) => `
    <div class="tenant-h">${I.store}<div><b>${TENANTS[t].name}</b><span>${LOKASI} · siap ± ${EST.disiapkan} menit</span></div></div>
    ${ms.map(m=>`<div class="row"><img src="${m.img}" alt=""><div class="info"><div class="nm">${esc(m.name)}</div><div class="tn">${TENANTS[m.t].name}</div>
      <div class="pl"><span class="pr">${price(m.price)}</span>${qtyOf(m.id)?stepper(m):`<button class="btn btn-order" data-a="order" data-v="${m.id}">Order</button>`}</div></div></div>`).join('')}
  `).join('')}</div>`;
}

    body = PAYS.map(p=>`<button class="sopt ${S.pay===p.id?'on':''}" data-a="pickPay" data-v="${p.id}">${p.id==='qris'?I.qrs:`<span class="dot" style="background:${p.color}">${p.ch}</span>`}${p.name}</button>`).join(''); }
  if(S.sheet==='floor'){ title='Pilih posisi kamu';
    body = Array.from({length:15},(_,i)=>i+1).map(n=>`<button class="sopt ${S.floor===n?'on':''}" data-a="pickFloor" data-v="${n}">${I.stairs}Lantai ${n}</button>`).join(''); }
  if(S.sheet==='room'){ title='Ruangan mana';
    body = `<textarea class="note" id="room" rows="4" placeholder="Tuliskan kamu di ruangan/daerah mana">${esc(S.room)}</textarea><button class="btn" style="height:38px;margin-top:6px" data-a="saveRoom">Simpan</button>`; }
  if(S.sheet==='time'){ title='Pilih kapan makanan mu diantar';
    body = SLOTS.map(s=>`<button class="sopt ${S.slot===s?'on':''}" data-a="pickSlot" data-v="${s}">${I.clock}${s}</button>`).join(''); }
  if(S.sheet==='voucher'){ title='Kode Voucher';

  return `<div class="dim" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="${title}"><div class="handle"></div><h2>${title}</h2><div class="opts">${body}</div></div></div>`;

/* ======================= RENDER ======================= */
function render(keepScroll){
  const sc = $app.querySelector('.scroll'), top = sc ? sc.scrollTop : 0;
  const hs = $app.querySelector('.hs'), left = hs ? hs.scrollLeft : 0;
  const ae = document.activeElement, focusId = ae && ae.id && $app.contains(ae) ? ae.id : null;
  const r = cur();
  $app.innerHTML = (S.splash ? `<div class="splash" data-a="skipSplash" role="img" aria-label="ByFood">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      <span class="ring"></span><span class="ring r2"></span>
      <img class="sp-icon" src="${IMG.logoIcon}" alt="">
      <img class="sp-word" src="${IMG.logoWord}" alt="ByFood">
      <div class="sp-tag">Pesan makanan kantin, <b>tanpa antre</b></div>
      <div class="sp-load"><i></i></div>
      <div class="sp-foot">Kantin BINUS University</div>
    </div>` : '')
    + SCREENS[r.name](r) + sheetHTML() + modalHTML() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  if(keepScroll){ const s=$app.querySelector('.scroll'); if(s) s.scrollTop = top; const h=$app.querySelector('.hs'); if(h) h.scrollLeft = left; }
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); if(el.setSelectionRange && el.type!=='date' && el.type!=='email') try{ el.setSelectionRange(el.value.length, el.value.length);}catch(e){} } }
  const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight;
}

/* ======================= ALUR CHECKOUT ======================= */
// FEEDBACK: urutan diubah — jadwal & lokasi dulu, metode pembayaran di akhir
function continueCheckout(){
  if(!S.cart.length) return;
  S.pending = true;
  if(S.mode==='delivery' && !S.floor){ S.sheet='floor'; return render(true); }
  if(S.mode==='delivery' && S.when==='later' && !S.slot){ S.sheet='time'; return render(true); }
  if(!S.pay){ S.sheet='pay'; return render(true); }
  S.pending=false; S.sheet=null; go('pay');
}
function placeOrder(){
  const groups = {};
  S.cart.forEach(c => (groups[item(c.id).t] ||= []).push({...c}));
  const ids = [];
  Object.entries(groups).forEach(([t,items],i) => {
    const sub = items.reduce((a,c)=>a+item(c.id).price*c.qty,0);
    const fees = i===0 ? (S.mode==='delivery'?ONGKIR:0)+ADMIN : 0;
    const o = {id:'o'+Date.now()+i, t, items, mode:S.mode, floor:S.floor, room:S.room, total:sub+fees, created:Date.now(), pay:S.pay,
               slot: S.mode==='delivery'&&S.when==='later' ? S.slot : null, delayed:false};
    S.orders.unshift(o); ids.push(o.id);
    notify(o,'Pesananmu sudah terbayar!','Pesananmu sudah terbayar! tinggal menunggu makananmu selesai disiapkan, dan bisa segera diambil/diantar. Cek status makananmu disini');
  });
  S.cart=[]; S.note=''; S.msg=''; S.lastOrders=ids; S.modal='success';
  render();
}

/* ======================= EVENT ======================= */
const ACT = {
  skipSplash(){ endSplash(); },
  back, tab:v=>tab(v), go:v=>go(v),
  cat(v){ S.filter='all'; S.query=''; go('cat',{title:v}); },
  find(v){ S.filter='all'; S.query=v; go('cat',{title:'Hasil Pencarian', all:true}); },
  tenant(v){ S.filter='all'; S.query=''; go('cat',{title:TENANTS[v].name, tenant:v}); },
  chip(v){ S.filter=v; render(true); },
  order(v){ setQty(v, qtyOf(v)+1); },
  inc(v){ setQty(v, qtyOf(v)+1); },
  dec(v){ setQty(v, qtyOf(v)-1); },
  mode(v){ S.mode=v; render(true); },
  when(v){ if(v==='later'){ S.sheet='time'; } else { S.when='now'; } render(true); },
  sheet(v){ S.pending=false; S.sheet=v; render(true); },
  closeSheet(v,el,e){ if(e.target===el){ S.sheet=null; S.pending=false; render(true); } },
  pickFloor(v){ S.floor=+v; S.sheet='room'; render(true); setTimeout(()=>document.getElementById('room')?.focus(),50); },
  saveRoom(){ S.room=document.getElementById('room').value.trim(); S.sheet=null; if(S.pending) continueCheckout(); else render(true); },
  pickSlot(v){ S.slot=v; S.when='later'; S.sheet=null; if(S.pending) continueCheckout(); else render(true); },
  pickPay(v){ S.pay=v; S.sheet=null; if(S.pending) continueCheckout(); else render(true); },
  checkout(){ continueCheckout(); },
  voucher(){ S.sheet='voucher'; render(true); },
  applyVoucher(){ const v=document.getElementById('vc').value.trim(); S.sheet=null; toast(v?`Kode "${v}" tidak berlaku`:'Masukkan kode voucher dulu'); },
  paid(){ placeOrder(); },
  closeModal(){ S.modal=null; S.stack=[{name:'home'}]; render(); },
  trackNew(){ S.modal=null; S.stack=[{name:'home'},{name:'track', id:S.lastOrders[0]}]; render(); },
  track(v){ go('track',{id:v}); },
  openNotif(v){ const n=S.notifs.find(n=>n.id===v); n.read=true; if(order(n.order)) go('track',{id:n.order}); else render(true); },
  chat(v){ go('chat',{who:v}); },
  call(){ toast('Menghubungi Aldi Jebewan…'); },
  dlqr(){ const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 21 21" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/><path fill="#000" d="${QR_PATH}"/></svg>`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); a.download='qris-byfood.svg'; a.click(); toast('QR berhasil diunduh'); },
  photo(){ document.getElementById('photoInput').click(); },
  pw(){ toast('Link ubah kata sandi dikirim ke email'); },
};
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = ACT[el.dataset.a]; if(fn){ e.preventDefault(); fn(el.dataset.v, el, e); }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if(f.dataset.form==='send'){
    const inp=f.querySelector('input'), text=inp.value.trim(); if(!text) return;
    const who=f.dataset.v; S.chats[who].push({me:true,text,at:Date.now()}); render();
    document.getElementById('chatIn').focus();
    setTimeout(()=>{ S.chats[who].push({me:false,text: who==='kurir'?'Siap kak, ditunggu ya':'Baik kak, kami cek dulu ya', at:Date.now()}); if(cur().name==='chat') render(); }, 1400);
  }
  if(f.dataset.form==='saveProfile'){
    S.user.name=document.getElementById('pn').value.trim()||S.user.name;
    S.user.email=document.getElementById('pe').value.trim()||S.user.email;
    S.user.dob=document.getElementById('pd').value;
    S.stack.pop(); toast('Profil berhasil disimpan');
  }
});
$app.addEventListener('change', e => {
  const t=e.target; if(t.classList.contains('stp-n')) setQty(t.dataset.id, parseInt(t.value,10)||0);
});
$app.addEventListener('input', e => {
  const t=e.target;
  if(t.id==='note') S.note=t.value;
  if(t.id==='msg') S.msg=t.value;
  if(t.id==='q'){ S.query=t.value; document.getElementById('list').innerHTML=listHTML(cur()); }
});
$app.addEventListener('keydown', e => {
  if(e.target.classList.contains('stp-n') && e.key==='Enter') e.target.blur();
  if(e.target.id==='hq' && e.key==='Enter'){ S.filter='all'; S.query=e.target.value; go('cat',{title:'Hasil Pencarian', all:true}); }
});
document.getElementById('photoInput').addEventListener('change', e => {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ S.user.photo=r.result; render(true); }; r.readAsDataURL(f);
});

/* ======================= SIMULASI STATUS ======================= */
const LIVE = new Set(['home','orders','track','notif']);
function tick(){
  let changed=false;
  S.orders.forEach(o=>{
    if(o.done || o.slot) return;
    const p=prog(o), sig=p.idx+'|'+p.revealed+'|'+p.rem;
    if(sig===o.sig) return;
    changed=true; o.sig=sig;
    if(o.lastIdx!==p.idx){
      const s=p.st[p.idx];
      if(s==='siap') notify(o,'Pesananmu sudah siap!', o.mode==='delivery'?'Pesananmu sudah jadi dibuat! pesanan akan segera diantar ke lantai tempat kamu berada, ditunggu yaa!':'Pesananmu sudah jadi dibuat! silahkan ambil di tenant ya.');
      if(s==='diantar') notify(o,'Pesananmu sedang diantar','Kurir sedang menuju lantai '+(o.floor||'')+'. Pantau posisinya di halaman tracking.');
      if(s==='selesai'){
        o.done=true; o.times=p.times;
        if(o.delayed){ S.points+=KOMPENSASI; notify(o,'Maaf pesananmu terlambat','Pesananmu tiba '+(p.actTotal-p.estTotal)+' menit lebih lama dari estimasi. Kamu dapat '+KOMPENSASI+' poin kompensasi.'); }
        else notify(o,'Pesanan selesai','Selamat menikmati makananmu!');
      }
      o.lastIdx=p.idx;
    }
    if(p.revealed && !o.toldDelay){ o.toldDelay=true; notify(o,'Estimasi waktu diperbarui','Tenant butuh waktu lebih lama, estimasi bertambah '+(p.actTotal-p.estTotal)+' menit.'); }
  });
  if(changed && !S.splash && LIVE.has(cur().name) && !S.sheet) render(true);
}
S.orders.forEach(o=>{ o.lastIdx=0; });
setInterval(tick, 500);

render();
function endSplash(){
  if(!S.splash || endSplash.done) return; endSplash.done=true;
  const el=$app.querySelector('.splash'); if(el) el.classList.add('hide');
  setTimeout(()=>{ S.splash=false; render(); }, 450);
}
setTimeout(endSplash, 3000);
</script>
</body>
